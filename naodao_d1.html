<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>引导练习与日常安排研究 · 第二天</title>
<script src="https://unpkg.com/jspsych@7.3.4"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-initialize-microphone@1.0.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-audio-response@1.0.3"></script>
<link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">
<!-- 脑岛平台对接（只有在脑岛里运行时才需要；Credamo 不需要，可保留，无害） -->
<script src="https://www.naodao.com/public/experiment/libs/axios.min.js"></script>
<script src="https://www.naodao.com/public/experiment/libs/extension/naodao-2021-12.js"></script>
<style>
  body { background: #f5f7fa; }
  .jspsych-content { max-width: 720px; font-size: 16px; line-height: 1.7; color: #1a1a1a; }
  .lg-box { text-align: left; background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 16px 20px; margin: 8px 0; }
  .lg-box h2, .lg-box h3 { color: #1F4E79; margin: 4px 0 10px; }
  .lg-form label.lg-radio { display: block; margin: 4px 0; }
  .lg-q { margin: 12px 0; padding: 8px 0; border-top: 1px dashed #e3e6ea; }
  .lg-q input[type=text], .lg-q input[type=number], .lg-q textarea, .lg-q select { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; border: 1px solid #c9ced4; border-radius: 6px; margin-top: 4px; }
  .lg-q input[type=number] { width: 120px; }
  .lg-likert { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; font-size: 14px; }
  .lg-likert label { display: flex; flex-direction: column; align-items: center; }
  .lg-sl { display: grid; grid-template-columns: 7em 1fr 2em; align-items: center; gap: 8px; margin: 8px 0; }
  .lg-sl input[type=range] { width: 100%; }
  .lg-row { display: grid; grid-template-columns: 7em 1fr 3em; align-items: center; gap: 8px; margin: 12px 0; }
  .lg-row .lg-name { font-weight: 600; }
  .lg-row output { text-align: right; font-weight: 700; color: #1F4E79; }
  .lg-sum { text-align: right; font-size: 15px; }
  .lg-card { background: #FFF8E1; border: 1px solid #F0D48A; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
  .lg-code { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #C00000; margin: 8px 0; }
  .lg-player button { font-size: 16px; padding: 8px 18px; margin-right: 8px; }
  .lg-muted { color: #666; font-size: 14px; }
  .lg-dd { font-size: 18px; }
  .jspsych-btn { font-size: 16px; padding: 10px 22px; }
</style>
</head>
<body>
<script>window.LG_SESSION = "d1"; window.LG_PLATFORM = "naodao";</script>
<script src="config.js"></script>
<script src="study.js"></script>
</body>
</html>
